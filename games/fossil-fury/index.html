:root{--bg:#0d0907;--fg:#efe4c8}

#denLink[hidden]{display:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;outline:none;cursor:crosshair}

let pad=null,padPrev=[];
function pollPad(){pad=null;const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps)if(p&&p.connected){pad=p;break;}
  if(pad){const b=pad.buttons.map(x=>x.pressed);if(b[9]&&!padPrev[9])onPress('Escape');if((b[4]&&!padPrev[4])||(b[5]&&!padPrev[5]))onPress('Bomb');if(b[0]&&!padPrev[0]&&state!=='play')onPress('Enter');padPrev=b;}}
function getMove(){let x=0,y=0;if(keys.KeyA||keys.KeyQ)x--;if(keys.KeyD)x++;if(keys.KeyW||keys.KeyZ)y--;if(keys.KeyS)y++;
  if(pad){const ax=pad.axes[0]||0,ay=pad.axes[1]||0;if(Math.hypot(ax,ay)>0.25){x+=ax;y+=ay;}if(pad.buttons[14]&&pad.buttons[14].pressed)x--;if(pad.buttons[15]&&pad.buttons[15].pressed)x++;if(pad.buttons[12]&&pad.buttons[12].pressed)y--;if(pad.buttons[13]&&pad.buttons[13].pressed)y++;}
  for(const id in touches){const t=touches[id];if(t.side==='L'){x+=(t.x-t.ox)/18;y+=(t.y-t.oy)/18;}}
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}return{x,y};}
function card(dx,dy){return Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];}
function getShoot(){if(shootOrder.length)return SHOOTKEYS[shootOrder[shootOrder.length-1]];
  if(mouse.down&&G){const dx=mouse.x-G.p.x,dy=mouse.y-(G.p.y-4);if(Math.hypot(dx,dy)>2)return card(dx,dy);}
  if(pad){const ax=pad.axes[2]||0,ay=pad.axes[3]||0;if(Math.hypot(ax,ay)>0.45)return card(ax,ay);const b=pad.buttons;if(b[3]&&b[3].pressed)return[0,-1];if(b[0]&&b[0].pressed)return[0,1];if(b[2]&&b[2].pressed)return[-1,0];if(b[1]&&b[1].pressed)return[1,0];}
  for(const id in touches){const t=touches[id];if(t.side==='R'){const dx=t.x-t.ox,dy=t.y-t.oy;if(Math.hypot(dx,dy)>6)return card(dx,dy);}}
  return null;}

function makePlayer(){return{x:CX,y:CY+20,r:5,vx:0,vy:0,hp:6,maxHp:6,speed:1.35,dmg:3.5,fireDelay:22,shotSpeed:3.0,range:44,multi:1,size:2.5,fire:false,homing:false,luck:0,cd:0,inv:0,face:'down',items:[],bounce:0,toot:false,tootT:0,pets:0,googly:false,party:false,shells:0,bombs:1,boomer:false,magnet:false};}
function newGame(){srand((Math.random()*1e9)|0);G={floor:1,p:makePlayer(),shots:[],eshots:[],parts:[],hazards:[],enemies:[],kills:0,time:0,shake:0,fade:1,banner:null,itemPool:shuffle(Object.keys(ITEMS)),flowT:0,bossIntro:0,deadT:0,pops:[],freeze:0,bombs:[]};startFloor();state='play';}
function startFloor(){genFloor();G.p.x=CX;G.p.y=CY+20;G.p.vx=G.p.vy=0;enterRoom(G.rooms.find(r=>r.type==='start'));SND.play('cave',G.floor);G.banner={title:'FLOOR '+G.floor,sub:FLOORS[G.floor-1].name,t:170};}
function takeItem(){return G.itemPool.pop()||null;}

// ---------- floor generation ----------
const key=(x,y)=>x+','+y;
function genFloor(){
  for(let attempt=0;attempt<400;attempt++){
    const map={},list=[];const add=(x,y)=>{const r={gx:x,gy:y,type:'normal'};map[key(x,y)]=r;list.push(r);return r;};
    add(4,4).type='start';const target=Math.min(7+G.floor*2+ri(0,2),15);let guard=0;
    while(list.length<target&&guard++<600){const b=pick(list);const[dx,dy]=pick(DIRS4);const nx=b.gx+dx,ny=b.gy+dy;if(nx<0||ny<0||nx>8||ny>7||map[key(nx,ny)])continue;let nb=0;for(const[ex,ey]of DIRS4)if(map[key(nx+ex,ny+ey)])nb++;if(nb>1)continue;add(nx,ny);}
    if(list.length<target)continue;
    const nbrs=r=>DIRS4.map(([dx,dy])=>map[key(r.gx+dx,r.gy+dy)]).filter(Boolean);
    const q=[list[0]];list[0].d=0;for(let h=0;h<q.length;h++){for(const n of nbrs(q[h]))if(n.d==null){n.d=q[h].d+1;q.push(n);}}
    const ends=list.filter(r=>r.type!=='start'&&nbrs(r).length===1).sort((a,b)=>b.d-a.d);
    if(ends.length<(attempt<300?3:2)||ends[0].d<3)continue;
    ends[0].type='boss';const rest=shuffle(ends.slice(1));rest[0].type='treasure';if(rest[1])rest[1].type='shop';
    for(const r of list){
      r.doors={u:!!map[key(r.gx,r.gy-1)],d:!!map[key(r.gx,r.gy+1)],l:!!map[key(r.gx-1,r.gy)],r:!!map[key(r.gx+1,r.gy)]};
      r.seed=ri(1,1e9);r.cleared=r.type==='start'||r.type==='treasure'||r.type==='shop';r.visited=false;r.seen=false;r.pickups=[];r.splats=[];r.bg=null;
      r.tiles=layout(r);if(r.type==='normal')r.spawns=makeSpawns(r);
      if(r.type==='shop'){r.npc={x:CX,y:CY-12};const id=takeItem();const wares=[id?{ware:'item',id,price:12}:{ware:'meat',price:4},{ware:'meat',price:4},{ware:'coconut',price:4}];
        wares.forEach((w,i)=>r.pickups.push(Object.assign({type:'shop',x:CX-50+i*50,y:CY+26,t:0},w)));}
      if(r.type==='treasure'){const id=takeItem();r.pickups.push(id?{type:'item',id,x:CX,y:CY,t:0}:{type:'meat',x:CX,y:CY,t:0});}
    }
    G.map=map;G.rooms=list;return;
  }
  throw new Error('floor generation failed');
}
function layout(r){
  const t=Array.from({length:RH},()=>new Array(RW).fill(0));if(r.type!=='normal')return t;
  const put=(x,y,v)=>{for(const[px,py]of[[x,y],[RW-1-x,y],[x,RH-1-y],[RW-1-x,RH-1-y]])t[py][px]=v;};
  const kind=ri(0,7);
  if(kind===1){const x=ri(2,5),y=ri(1,2);put(x,y,1);put(x+1,y,1);put(x,y+1,1);put(x+1,y+1,1);}
  else if(kind===2){const n=ri(3,6);for(let i=0;i<n;i++)put(ri(1,7),ri(1,3),pick([1,1,2,4]));}
  else if(kind===3){for(let y=2;y<8;y++)for(let x=5;x<13;x++)if(rnd()<0.8)t[y][x]=3;for(let i=0;i<2;i++)put(ri(1,3),ri(1,2),2);}
  else if(kind===4){const y=ri(1,2);for(let x=ri(1,3);x<7;x++)put(x,y,2);}
  else if(kind===5){const x=ri(3,6);for(let y=1;y<4;y++)put(x,y,4);}
  else if(kind===6){for(let y=0;y<2;y++)for(let x=0;x<3;x++)put(x,y,1);put(ri(4,6),ri(1,3),2);}
  else if(kind===7){for(let i=0;i<5;i++)put(ri(1,7),ri(0,3),2);}
  if(G.floor>=2&&rnd()<0.5)for(let i=0;i<ri(2,5);i++){const x=ri(0,RW-1),y=ri(0,RH-1);if(!t[y][x])t[y][x]=3;}
  for(let x=0;x<RW;x++){if(solidT(t[4][x]))t[4][x]=0;if(solidT(t[5][x]))t[5][x]=0;}
  for(let y=0;y<RH;y++){if(solidT(t[y][8]))t[y][8]=0;if(solidT(t[y][9]))t[y][9]=0;}
  return t;
}
function reachable(t){const seen=new Uint8Array(RW*RH);const q=[8+4*RW];seen[q[0]]=1;const out=[];for(let h=0;h<q.length;h++){const i=q[h],x=i%RW,y=(i/RW)|0;out.push({x,y});for(const[dx,dy]of DIRS4){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=RW||ny>=RH)continue;const ni=nx+ny*RW;if(seen[ni]||solidT(t[ny][nx]))continue;seen[ni]=1;q.push(ni);}}return out;}
function makeSpawns(r){
  const f=G.floor;const pool=f===1?['compy','compy','ptero','egg','spitter','dodo','dodo','raptor']:f===2?['compy','ptero','spitter','ankylo','egg','dodo','raptor','stego']:['ptero','spitter','ankylo','raptor','raptor','stego','stego','egg','dodo'];
  const doorsXY=[[8.5,-0.5],[8.5,RH-0.5],[-0.5,4.5],[RW-0.5,4.5]];
  const cells=reachable(r.tiles).filter(c=>r.tiles[c.y][c.x]!==3&&doorsXY.every(([dx,dy])=>Math.hypot(c.x-dx,c.y-dy)>4.5));
  let n=ri(2,3)+f;const pack=rnd()<0.18;if(pack)n+=2;const out=[];
  for(let i=0;i<n&&cells.length;i++){const c=cells.splice(Math.floor(rnd()*cells.length),1)[0];out.push({type:pack?'compy':pick(pool),x:IX+c.x*T+8,y:IY+c.y*T+8});}
  return out;
}

// ---------- rooms ----------
function renderRoomBG(room){
  const c=room.bg||(room.bg=document.createElement('canvas'));c.width=W;c.height=H;const g=c.getContext('2d');const P=FLOORS[G.floor-1];const r=mkrng(room.seed);
  g.fillStyle=P.wallD;g.fillRect(0,32,W,H-32);
  for(let i=0;i<300;i++){let x,y;const side=(r()*4)|0;if(side===0){x=r()*W;y=32+r()*15;}else if(side===1){x=r()*W;y=H-15+r()*15;}else if(side===2){x=r()*15;y=32+r()*(H-32);}else{x=W-15+r()*15;y=32+r()*(H-32);}
    const s=2+r()*4;g.fillStyle=OUT;pcirc(g,x,y,s+1);g.fillStyle=P.wall;pcirc(g,x,y,s);g.fillStyle=P.wallL;pcirc(g,x-1,y-1,Math.max(0,s-2.5));}
  g.fillStyle=P.floor;g.fillRect(IX,IY,IW,IH);
  for(let i=0;i<16;i++){g.fillStyle=r()<0.5?P.floorD:P.floorL;g.globalAlpha=0.35;pell(g,IX+r()*IW,IY+r()*IH,6+r()*20,3+r()*8);}
  g.globalAlpha=1;
  for(let i=0;i<700;i++){g.fillStyle=r()<0.55?P.floorD:P.floorL;g.fillRect(IX+((r()*IW)|0),IY+((r()*IH)|0),r()<0.3?2:1,1);}
  g.fillStyle=P.floorD;for(let i=0;i<7;i++){let x=IX+r()*IW,y=IY+r()*IH;for(let j=0;j<14;j++){x+=(r()*3|0)-1;y+=(r()*3|0)-1;if(x>IX&&x<IX+IW&&y>IY&&y<IY+IH)g.fillRect(x|0,y|0,1,1);}}
  const dec=['skull','bone','bone'];for(let i=0;i<ri2(r,0,3);i++){const s=getSpr(dec[(r()*3)|0],0);g.globalAlpha=0.75;g.drawImage(s,(IX+8+r()*(IW-24))|0,(IY+8+r()*(IH-20))|0);g.globalAlpha=1;}
  g.fillStyle=P.moss;for(let i=0;i<10;i++){const x=(IX+r()*IW)|0,y=(IY+r()*IH)|0;g.fillRect(x,y,1,2);g.fillRect(x+1,y+1,1,1);g.fillRect(x-1,y+1,1,1);}
  g.fillStyle='rgba(0,0,0,0.38)';g.fillRect(IX,IY,IW,5);g.fillRect(IX,IY,4,IH);g.fillStyle='rgba(0,0,0,0.2)';g.fillRect(IX+IW-3,IY,3,IH);g.fillRect(IX,IY+IH-2,IW,2);
  g.fillStyle=OUT;g.fillRect(IX-1,IY-1,IW+2,1);g.fillRect(IX-1,IY+IH,IW+2,1);g.fillRect(IX-1,IY,1,IH);g.fillRect(IX+IW,IY,1,IH);
  if(room.type==='start'&&G.floor===1){const col=P.floorL;drawText(g,'WASD - MOVE',CX,IY+14,1,col,'center',null);drawText(g,'ARROW KEYS OR MOUSE - THROW ROCKS',CX,IY+24,1,col,'center',null);drawText(g,'E OR SHIFT - DROP A COCONUT BOMB',CX,IY+34,1,col,'center',null);drawText(g,'HUNT THE BEAST. DIG DEEPER.',CX,IY+IH-18,1,col,'center',null);}
  for(const s of room.splats)drawSplat(g,s);
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){const v=room.tiles[y][x];if(v)g.drawImage(tileSpr(v,G.floor),IX+x*T,IY+y*T);}
}
function ri2(r,a,b){return a+Math.floor(r()*(b-a+1));}
function drawSplat(g,s){const r=mkrng(s.s);g.fillStyle=s.col;g.globalAlpha=0.55;const n=s.big?40:10;const sp=s.big?18:6;for(let i=0;i<n;i++){const a=r()*6.28,d=r()*sp;pcirc(g,s.x+Math.cos(a)*d,s.y+Math.sin(a)*d*0.6,r()*(s.big?3:1.6));}g.globalAlpha=1;}
function addSplat(x,y,col,big){const s={x,y,col,s:(R()*1e9)|0,big};G.room.splats.push(s);if(G.room.bg)drawSplat(G.room.bg.getContext('2d'),s);}

function enterRoom(r){
  G.room=r;r.visited=true;r.seen=true;for(const[dx,dy]of DIRS4){const n=G.map[key(r.gx+dx,r.gy+dy)];if(n)n.seen=true;}
  renderRoomBG(r);G.shots=[];G.eshots=[];G.parts=[];G.hazards=[];G.enemies=[];G.pops=[];G.bombs=[];G.p.say=null;G.flow=null;G.flowT=0;G.boss=null;
  if(!r.cleared){
    if(r.type==='boss'){const bt=BOSSTYPES[G.floor-1];const b=spawnEnemy(bt,CX+70,bt==='pqueen'?IY+40:CY,0);b.st='walk';b.t=-40;G.boss=b;G.bossIntro=140;b.say={text:pickR(EDEF[bt].taunts),t:230};SND.play('boss',G.floor);SND.fx('roar');}
    else{for(const s of r.spawns)spawnEnemy(s.type,s.x,s.y,40);SND.fx('slam');}
  }
  G.fade=1;
}
function goRoom(dx,dy){
  const n=G.map[key(G.room.gx+dx,G.room.gy+dy)];if(!n)return;const p=G.p;
  if(dx===-1){p.x=IX+IW-p.r-6;p.y=CY;}else if(dx===1){p.x=IX+p.r+6;p.y=CY;}else if(dy===-1){p.y=IY+IH-p.r-6;p.x=CX;}else{p.y=IY+p.r+8;p.x=CX;}
  p.vx*=0.3;p.vy*=0.3;enterRoom(n);
}
function clearRoom(){
  const r=G.room;r.cleared=true;SND.fx('door');
  if(r.type==='boss'){const id=takeItem();r.pickups.push(id?{type:'item',id,x:CX-40,y:CY,t:0}:{type:'meat',x:CX-40,y:CY,t:0});r.trapdoor={x:CX+40,y:CY};for(let i=0;i<3;i++)r.pickups.push({type:'shell',x:CX-12+i*12,y:CY+28,t:0});SND.fx('fanfare');SND.play('cave',G.floor);
    G.banner={title:'BEAST SLAIN!',sub:G.floor>=3?'CLIMB INTO THE LIGHT':'DROP INTO THE HOLE TO DIG DEEPER',t:200};}
  else{const roll=rnd();if(roll<0.1&&G.itemPool.length)r.pickups.push({type:'item',id:takeItem(),x:CX,y:CY,t:0});else if(roll<0.38+G.p.luck*0.15)r.pickups.push({type:rnd()<0.4?'meat':'berry',x:CX,y:CY,t:0});else if(roll<0.52)r.pickups.push({type:'coconut',x:CX,y:CY,t:0});else if(roll<0.72){const n=ri(1,3);for(let i=0;i<n;i++)r.pickups.push({type:'shell',x:CX-10+i*10,y:CY,t:0});}}
}
function nextFloor(){
  if(G.floor>=3){state='win';G.deadT=0;SND.fx('fanfare');saveBest(4);return;}
  G.floor++;SND.fx('descend');saveBest(G.floor);startFloor();
}

function burst(x,y,col,n,spd=1.5,z=4,life=30,size=1){for(let i=0;i<n;i++){const a=R()*6.28,s=R()*spd;G.parts.push({x,y,z,vx:Math.cos(a)*s,vy:Math.sin(a)*s*0.7,vz:0.5+R()*2,life:life*(0.6+R()*0.6),col,s:size+(R()<0.3?1:0)});}}
function dust(x,y,n=1){for(let i=0;i<n;i++)G.parts.push({x:x+(R()-0.5)*6,y:y+(R()-0.5)*3,z:1,vx:(R()-0.5)*0.4,vy:(R()-0.5)*0.2,vz:0.3,life:18,col:'rgba(200,180,150,0.5)',s:2,nb:1});}
function shake(n){G.shake=Math.max(G.shake,n);}
function eshot(x,y,vx,vy,kind){G.eshots.push({x,y,vx,vy,kind,r:kind==='fire'?4:3,life:260,z:kind==='rock'?3:6});}
function tileAt(x,y){const tx=Math.floor((x-IX)/T),ty=Math.floor((y-IY)/T);if(tx<0||ty<0||tx>=RW||ty>=RH)return -1;return G.room.tiles[ty][tx];}
function setTile(x,y,v){const tx=Math.floor((x-IX)/T),ty=Math.floor((y-IY)/T);G.room.tiles[ty][tx]=v;renderRoomBG(G.room);}
function clampInterior(e){let hit=false;if(e.x<IX+e.r){e.x=IX+e.r;hit=true;}if(e.x>IX+IW-e.r){e.x=IX+IW-e.r;hit=true;}if(e.y<IY+e.r){e.y=IY+e.r;hit=true;}if(e.y>IY+IH-e.r){e.y=IY+IH-e.r;hit=true;}return hit;}
function collideTiles(e){
  const t=G.room.tiles;let hit=false;const x0=Math.floor((e.x-e.r-IX)/T),x1=Math.floor((e.x+e.r-IX)/T),y0=Math.floor((e.y-e.r-IY)/T),y1=Math.floor((e.y+e.r-IY)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(tx<0||ty<0||tx>=RW||ty>=RH||!solidT(t[ty][tx]))continue;
    const rx=IX+tx*T+1,ry=IY+ty*T+1,rw=T-2;const nx=clamp(e.x,rx,rx+rw),ny=clamp(e.y,ry,ry+rw);let dx=e.x-nx,dy=e.y-ny;const d2=dx*dx+dy*dy;
    if(d2<e.r*e.r){hit=true;if(d2<0.0001){const l=e.x-rx,rr=rx+rw-e.x,u=e.y-ry,b=ry+rw-e.y;const m=Math.min(l,rr,u,b);if(m===l)e.x=rx-e.r;else if(m===rr)e.x=rx+rw+e.r;else if(m===u)e.y=ry-e.r;else e.y=ry+rw+e.r;}
      else{const d=Math.sqrt(d2),push=e.r-d;e.x+=dx/d*push;e.y+=dy/d*push;}}}
  return hit;
}
function computeFlow(){
  const t=G.room.tiles,d=new Int16Array(RW*RH).fill(-1);const px=clamp(Math.floor((G.p.x-IX)/T),0,RW-1),py=clamp(Math.floor((G.p.y-IY)/T),0,RH-1);
  const q=[px+py*RW];d[q[0]]=0;
  for(let h=0;h<q.length;h++){const i=q[h],x=i%RW,y=(i/RW)|0;for(const[dx,dy]of DIRS8){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=RW||ny>=RH)continue;const ni=nx+ny*RW;if(d[ni]>=0||solidT(t[ny][nx]))continue;if(dx&&dy&&(solidT(t[y][nx])||solidT(t[ny][x])))continue;d[ni]=d[i]+1;q.push(ni);}}
  G.flow=d;
}
function steer(e,gx,gy,spd,acc=0.15){const dx=gx-e.x,dy=gy-e.y,l=Math.hypot(dx,dy)||1;e.vx+=(dx/l*spd-e.vx)*acc;e.vy+=(dy/l*spd-e.vy)*acc;}
function chase(e,spd){
  let gx=G.p.x,gy=G.p.y;const f=G.flow;
  if(f){const tx=Math.floor((e.x-IX)/T),ty=Math.floor((e.y-IY)/T);if(tx>=0&&ty>=0&&tx<RW&&ty<RH){const cd=f[tx+ty*RW];if(cd>1){let best=cd,bx=-1,by=-1;for(const[dx,dy]of DIRS8){const nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=RW||ny>=RH)continue;const v=f[nx+ny*RW];if(v>=0&&v<best){best=v;bx=nx;by=ny;}}if(bx>=0){gx=IX+bx*T+8;gy=IY+by*T+8;}}}}
  steer(e,gx,gy,spd);
}

  const p=G.p;
  if(state==='pause'){drawOverlay('PAUSED',['DAMAGE '+p.dmg.toFixed(1)+'   THROWS/SEC '+(60/p.fireDelay).toFixed(1),'SPEED '+p.speed.toFixed(2)+'   RANGE '+p.range,'',...p.items.map(i=>ITEMS[i].name+' - '+ITEMS[i].desc).slice(0,6),'','ESC OR P TO RESUME   R TO QUIT',SND.muted?'M TO UNMUTE':'M TO MUTE'],'#f0d070');}
  else if(state==='dead'&&G.deadT>40){drawOverlay('YOU BECAME A FOSSIL',[G.epitaph||'','','REACHED FLOOR '+G.floor+' - '+FLOORS[G.floor-1].name,'DINOS BONKED: '+G.kills+'   TIME: '+fmtTime(G.time),'',G.deadT>50?(isTouch?'TAP TO TRY AGAIN':'PRESS ENTER TO TRY AGAIN'):''],'#e0603a');}
  else if(state==='win'&&G.deadT>20){drawOverlay('YOU ESCAPED!',['ALL THREE BEASTS ARE BONKED.','THE TRIBE WILL SING OF THIS.','','DINOS BONKED: '+G.kills+'   TIME: '+fmtTime(G.time),'ITEMS FOUND: '+p.items.length,'',G.deadT>50?(isTouch?'TAP TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN'):''],'#f0d070');}
}

// ---------- main loop ----------
let lastT=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-lastT);lastT=now;let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++;}if(n>=5)acc=0;try{render();}catch(e){console.error(e);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
cv.focus();
// debug hook for automated tests
window.__ff={get G(){return G;},get state(){return state;},newGame,onPress,nextFloor,goRoom,EDEF};
})();
</script>
<script>
// Arcade: show the Den link on the title, pause, game over and win screens, not mid-run.
(()=>{const l=document.getElementById('denLink');let last;const tick=()=>{const s=window.__ff&&window.__ff.state;const show=s!=='play';if(show!==last){l.hidden=!show;last=show;}requestAnimationFrame(tick);};tick();})();
</script>
