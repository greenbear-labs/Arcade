<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Froggy Farm">
<title>Froggy Farm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The whole farm is one SVG. Important things stay inside x 200..1400 so a 4:3 iPad
     (which crops the sides) and a wide phone (which crops top/bottom) both see everything. -->
<svg id="scene" class="screen" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gSkyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#dcf5ff"/></linearGradient>
    <linearGradient id="gSkyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a46"/><stop offset="1" stop-color="#3d4290"/></linearGradient>
    <radialGradient id="gPond" cx=".5" cy=".35" r=".65"><stop offset="0" stop-color="#8fe2ff"/><stop offset="1" stop-color="#3aa4dc"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fbffa8" stop-opacity=".95"/><stop offset=".45" stop-color="#e8ff6a" stop-opacity=".5"/><stop offset="1" stop-color="#d4ff4a" stop-opacity="0"/></radialGradient>
    <clipPath id="beeClip"><ellipse rx="50" ry="36"/></clipPath>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#gSkyDay)"/>
  <rect width="1600" height="900" fill="url(#gSkyNight)" class="night-only fade"/>
  <g id="stars" class="night-only fade"></g>

  <!-- sun / moon: tap to switch day and night -->
  <g id="sun" class="day-only fade tap" data-act="sun" transform="translate(1290,170)"><g class="anim">
    <g class="rays" fill="#ffc93c">
      <rect x="-9" y="-122" width="18" height="38" rx="9"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(30)"/>
      <rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(60)"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(90)"/>
      <rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(120)"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(150)"/>
      <rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(180)"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(210)"/>
      <rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(240)"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(270)"/>
      <rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(300)"/><rect x="-9" y="-122" width="18" height="38" rx="9" transform="rotate(330)"/>
    </g>
    <circle r="74" fill="#ffd93b" stroke="#ffb300" stroke-width="6"/>
    <ellipse cx="-25" cy="-12" rx="8" ry="11" fill="#6b4300"/><ellipse cx="25" cy="-12" rx="8" ry="11" fill="#6b4300"/>
    <circle cx="-44" cy="14" r="11" fill="#ff9a76" opacity=".7"/><circle cx="44" cy="14" r="11" fill="#ff9a76" opacity=".7"/>
    <path d="M-30 16 Q0 46 30 16" stroke="#6b4300" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g></g>
  <g id="moon" class="night-only fade tap" data-act="moon" transform="translate(1290,170)"><g class="anim">
    <circle r="66" fill="#fff4c2" stroke="#e9d98a" stroke-width="5"/>
    <circle cx="28" cy="-26" r="10" fill="#efe1a0"/><circle cx="-30" cy="30" r="7" fill="#efe1a0"/><circle cx="34" cy="30" r="5" fill="#efe1a0"/>
    <path d="M-34 -6 Q-22 4 -10 -6 M10 -6 Q22 4 34 -6" stroke="#7a6a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-14 20 Q0 32 14 20" stroke="#7a6a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g></g>

  <!-- clouds -->
  <g class="cloud tap" data-act="cloud" transform="translate(430,150)"><g class="drift"><g class="anim">
    <ellipse cx="0" cy="10" rx="110" ry="40" fill="#fff"/><circle cx="-45" cy="-10" r="42" fill="#fff"/><circle cx="20" cy="-28" r="55" fill="#fff"/><circle cx="72" cy="0" r="36" fill="#fff"/>
  </g></g></g>
  <g class="cloud tap" data-act="cloud" transform="translate(860,105)"><g class="drift slow"><g class="anim">
    <ellipse cx="0" cy="8" rx="85" ry="32" fill="#fff"/><circle cx="-30" cy="-10" r="34" fill="#fff"/><circle cx="22" cy="-22" r="42" fill="#fff"/>
  </g></g></g>

  <!-- hills, barn, fence, grass -->
  <path d="M0 500 Q 300 380 650 470 T 1300 430 T 1600 450 V900 H0Z" fill="#a6e07f"/>
  <g transform="translate(1000,512)">
    <rect x="-52" y="-62" width="104" height="62" fill="#d9483b" stroke="#9e2f26" stroke-width="4"/>
    <path d="M-64 -60 L0 -108 L64 -60Z" fill="#a8322a" stroke="#7e2520" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-20" y="-40" width="40" height="40" fill="#fff"/><path d="M-20 -40 L20 0 M20 -40 L-20 0" stroke="#d9483b" stroke-width="5"/>
  </g>
  <path d="M0 565 Q 400 490 800 545 T 1600 525 V900 H0Z" fill="#7fd05e"/>
  <g fill="#fffaf0" stroke="#c9b48e" stroke-width="3">
    <rect x="930" y="555" width="680" height="14" rx="5"/><rect x="930" y="590" width="680" height="14" rx="5"/>
    <rect x="945" y="535" width="20" height="90" rx="6"/><rect x="1035" y="535" width="20" height="90" rx="6"/><rect x="1125" y="535" width="20" height="90" rx="6"/>
    <rect x="1215" y="535" width="20" height="90" rx="6"/><rect x="1305" y="535" width="20" height="90" rx="6"/><rect x="1395" y="535" width="20" height="90" rx="6"/>
    <rect x="1485" y="535" width="20" height="90" rx="6"/><rect x="1575" y="535" width="20" height="90" rx="6"/>
  </g>
  <g stroke="#5fb544" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M260 640 l-8 -22 M268 640 l2 -26 M276 640 l10 -20"/><path d="M700 610 l-8 -22 M708 610 l2 -26 M716 610 l10 -20"/>
    <path d="M1420 800 l-8 -22 M1428 800 l2 -26 M1436 800 l10 -20"/><path d="M1100 850 l-8 -22 M1108 850 l2 -26 M1116 850 l10 -20"/>
  </g>

  <!-- pond with the frog's lily pad -->
  <g id="pond" class="tap" data-act="pond">
    <ellipse cx="450" cy="775" rx="315" ry="92" fill="url(#gPond)" stroke="#2f8fc4" stroke-width="6"/>
    <path d="M230 760 q 20 -8 40 0 M600 800 q 20 -8 40 0 M520 830 q 16 -6 32 0" stroke="#c9f2ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#3f8f2f" stroke-width="7" stroke-linecap="round"><path d="M160 760 q -6 -60 4 -110"/><path d="M182 770 q 0 -50 14 -86"/><path d="M738 770 q 4 -50 -6 -90"/></g>
    <g fill="#8a5a2b"><ellipse cx="166" cy="648" rx="9" ry="24"/><ellipse cx="197" cy="682" rx="8" ry="20"/><ellipse cx="731" cy="678" rx="8" ry="20"/></g>
    <path d="M450 742 m-176 0 a176 40 0 1 0 352 0 a176 40 0 1 0 -352 0" fill="#4fae3c" stroke="#3a8a2c" stroke-width="4"/>
    <path d="M450 742 L590 712 L612 728 Z" fill="#7cd0f0"/>
  </g>
  <g id="fxBack"></g>

  <!-- GAME 1, THE FROG: tap belly for a sticker, drag bugs onto him to feed him -->
  <g id="frog" class="tap" data-act="frog" data-color style="--main:#5cc84a;--dark:#3e9b32" transform="translate(450,735)">
    <g class="anim frog-anim">
      <ellipse cx="-118" cy="-38" rx="72" ry="44" fill="var(--dark)"/>
      <ellipse cx="118" cy="-38" rx="72" ry="44" fill="var(--dark)"/>
      <ellipse cx="0" cy="-100" rx="150" ry="112" fill="var(--main)"/>
      <g transform="translate(0,-84)" data-act="belly"><g class="belly">
        <ellipse rx="98" ry="74" fill="#f4f6b4"/>
        <path d="M-44 -24 q12 8 24 0 M18 -6 q12 8 24 0 M-18 26 q12 8 24 0" stroke="#dde19a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse class="belly-glow" rx="98" ry="74" fill="#fff"/>
      </g></g>
      <ellipse cx="-70" cy="-8" rx="42" ry="15" fill="var(--dark)"/>
      <ellipse cx="70" cy="-8" rx="42" ry="15" fill="var(--dark)"/>
      <g transform="translate(0,-200)" data-act="frog-head"><g class="head">
        <ellipse rx="142" ry="88" fill="var(--main)"/>
        <g transform="translate(-78,-68)">
          <circle r="52" fill="var(--main)"/>
          <g class="eye"><circle r="38" fill="#fff" stroke="var(--dark)" stroke-width="4"/><g class="pupil"><circle r="19" fill="#1d2b1a"/><circle cx="-6" cy="-7" r="6" fill="#fff"/></g></g>
          <path class="happy-eye" d="M-26 8 Q0 -22 26 8" stroke="#1d2b1a" stroke-width="9" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(78,-68)">
          <circle r="52" fill="var(--main)"/>
          <g class="eye"><circle r="38" fill="#fff" stroke="var(--dark)" stroke-width="4"/><g class="pupil"><circle r="19" fill="#1d2b1a"/><circle cx="-6" cy="-7" r="6" fill="#fff"/></g></g>
          <path class="happy-eye" d="M-26 8 Q0 -22 26 8" stroke="#1d2b1a" stroke-width="9" fill="none" stroke-linecap="round"/>
        </g>
        <circle cx="-98" cy="14" r="18" fill="#ff8fa8" opacity=".55"/><circle cx="98" cy="14" r="18" fill="#ff8fa8" opacity=".55"/>
        <path class="mouth-closed" d="M-78 10 Q0 64 78 10" stroke="#24521a" stroke-width="8" fill="none" stroke-linecap="round"/>
        <g class="mouth-open">
          <path d="M-74 8 Q0 104 74 8 Q0 36 -74 8Z" fill="#7a1d33" stroke="#24521a" stroke-width="6" stroke-linejoin="round"/>
          <ellipse cx="0" cy="54" rx="30" ry="12" fill="#ff7c9c"/>
        </g>
      </g></g>
    </g>
  </g>

  <!-- flowers (placeholder station): tap to chime; sometimes a butterfly pops out -->
  <g class="flower tap" data-act="flower" data-note="0" data-color style="--main:#ff6f91;--dark:#d94a6d" transform="translate(800,770)">
    <path d="M0 0 Q12 -60 0 -120" stroke="#3d9a2f" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="18" cy="-50" rx="22" ry="10" fill="#4fae3c" transform="rotate(-30 18 -50)"/>
    <g transform="translate(0,-120)"><g class="anim petals"></g></g>
  </g>
  <g class="flower tap" data-act="flower" data-note="2" data-color style="--main:#ffb347;--dark:#e08a1e" transform="translate(885,745)">
    <path d="M0 0 Q-14 -80 0 -165" stroke="#3d9a2f" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="-20" cy="-70" rx="22" ry="10" fill="#4fae3c" transform="rotate(30 -20 -70)"/>
    <g transform="translate(0,-165)"><g class="anim petals"></g></g>
  </g>
  <g class="flower tap" data-act="flower" data-note="4" data-color style="--main:#7aa7ff;--dark:#4b7ee0" transform="translate(965,785)">
    <path d="M0 0 Q10 -55 0 -110" stroke="#3d9a2f" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="16" cy="-46" rx="22" ry="10" fill="#4fae3c" transform="rotate(-30 16 -46)"/>
    <g transform="translate(0,-110)"><g class="anim petals"></g></g>
  </g>

  <!-- cow (placeholder station) -->
  <g id="cow" class="tap" data-act="cow" data-color style="--main:#3a3a3a;--dark:#222" transform="translate(1190,700)"><g class="anim">
    <g fill="#fff" stroke="#333" stroke-width="4">
      <rect x="-106" y="-78" width="22" height="78" rx="8"/><rect x="-66" y="-78" width="22" height="78" rx="8"/>
      <rect x="34" y="-78" width="22" height="78" rx="8"/><rect x="74" y="-78" width="22" height="78" rx="8"/>
    </g>
    <g fill="#5a463c"><rect x="-106" y="-14" width="22" height="14" rx="4"/><rect x="-66" y="-14" width="22" height="14" rx="4"/><rect x="34" y="-14" width="22" height="14" rx="4"/><rect x="74" y="-14" width="22" height="14" rx="4"/></g>
    <ellipse cx="25" cy="-60" rx="30" ry="16" fill="#ffb3c1" stroke="#333" stroke-width="3"/>
    <g transform="translate(132,-168)"><g class="tail">
      <path d="M0 0 Q34 20 24 72" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="24" cy="80" rx="11" ry="15" fill="#333"/>
    </g></g>
    <rect x="-136" y="-205" width="272" height="142" rx="70" fill="#fff" stroke="#333" stroke-width="5"/>
    <g fill="var(--main)"><ellipse cx="-30" cy="-160" rx="32" ry="23"/><ellipse cx="60" cy="-112" rx="36" ry="26"/><ellipse cx="96" cy="-175" rx="20" ry="15"/><ellipse cx="-82" cy="-100" rx="18" ry="14"/></g>
    <g transform="translate(-142,-190)"><g class="cow-head">
      <ellipse cx="-64" cy="-28" rx="28" ry="13" fill="#fff" stroke="#333" stroke-width="4" transform="rotate(-20 -64 -28)"/>
      <ellipse cx="64" cy="-28" rx="28" ry="13" fill="#fff" stroke="#333" stroke-width="4" transform="rotate(20 64 -28)"/>
      <path d="M-34 -46 q-10 -26 4 -34 q4 18 10 28z M34 -46 q10 -26 -4 -34 q-4 18 -10 28z" fill="#f4e1b5" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
      <ellipse rx="60" ry="55" fill="#fff" stroke="#333" stroke-width="5"/>
      <ellipse cx="22" cy="-26" rx="18" ry="14" fill="var(--main)"/>
      <circle cx="-22" cy="-6" r="8" fill="#222"/><circle cx="22" cy="-6" r="8" fill="#222"/><circle cx="-19" cy="-9" r="3" fill="#fff"/><circle cx="25" cy="-9" r="3" fill="#fff"/>
      <ellipse cy="30" rx="50" ry="30" fill="#ffb3c1" stroke="#333" stroke-width="4"/>
      <ellipse cx="-17" cy="26" rx="6" ry="8" fill="#c46a7d"/><ellipse cx="17" cy="26" rx="6" ry="8" fill="#c46a7d"/>
      <ellipse class="cow-mouth" cy="46" rx="15" ry="9" fill="#6b1a2a"/>
    </g></g>
  </g></g>

  <rect id="nightShade" class="night-only fade" width="1600" height="900" fill="#0a1450" opacity=".35" pointer-events="none"/>
  <g id="ambientFireflies" class="night-only fade" pointer-events="none">
    <g transform="translate(300,520)"><g class="ff-float"><circle r="30" fill="url(#gGlow)"/><circle r="5" fill="#f6ffb0"/></g></g>
    <g transform="translate(720,460)"><g class="ff-float b"><circle r="30" fill="url(#gGlow)"/><circle r="5" fill="#f6ffb0"/></g></g>
    <g transform="translate(1000,380)"><g class="ff-float c"><circle r="30" fill="url(#gGlow)"/><circle r="5" fill="#f6ffb0"/></g></g>
    <g transform="translate(1380,470)"><g class="ff-float"><circle r="30" fill="url(#gGlow)"/><circle r="5" fill="#f6ffb0"/></g></g>
    <g transform="translate(160,420)"><g class="ff-float c"><circle r="30" fill="url(#gGlow)"/><circle r="5" fill="#f6ffb0"/></g></g>
  </g>
  <line id="tongue" stroke="#ff6f91" stroke-width="20" stroke-linecap="round" visibility="hidden" pointer-events="none"/>
  <g id="stickers"></g>
  <g id="fx" pointer-events="none"></g>
  <g id="bubbles" pointer-events="none"></g>
</svg>

<!-- GAME 2, THE ICE CREAM KITCHEN: pick a cone or cup, tap tubs for scoops, tap jars for toppings,
     then drag the ice cream onto the penguin chef or a customer. -->
<svg id="icecream" class="screen" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ic-rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b8b"/><stop offset=".2" stop-color="#ffa53b"/><stop offset=".4" stop-color="#ffe14d"/>
      <stop offset=".6" stop-color="#7ee07a"/><stop offset=".8" stop-color="#6cb6ff"/><stop offset="1" stop-color="#b98bff"/>
    </linearGradient>
    <pattern id="ic-stripes" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#dff6ee"/><rect width="40" height="80" fill="#cdf0e3"/></pattern>
    <pattern id="ic-check" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#ffd3e2"/><rect width="40" height="40" fill="#fff"/><rect x="40" y="40" width="40" height="40" fill="#fff"/></pattern>
  </defs>

  <!-- wall, freezer case for the tubs, shelf for the toppings -->
  <rect width="1600" height="900" fill="url(#ic-stripes)"/>
  <g class="tap" data-act="bell" transform="translate(1290,90)"><g class="anim">
    <path d="M-34 20 Q-34 -26 0 -28 Q34 -26 34 20 Z" fill="#ffd93b" stroke="#e0a800" stroke-width="5"/>
    <rect x="-44" y="18" width="88" height="12" rx="6" fill="#e0a800"/><circle cy="-34" r="8" fill="#e0a800"/>
  </g></g>
  <rect x="240" y="110" width="725" height="165" rx="26" fill="#e9f8ff" stroke="#9fd3ea" stroke-width="6"/>
  <path d="M270 130 l40 0 M270 145 l20 0" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <rect x="975" y="248" width="450" height="18" rx="8" fill="#e0a96d" stroke="#b9824c" stroke-width="4"/>
  <g id="ic-tubs"></g>
  <g id="ic-jars"></g>

  <!-- the penguin chef stands behind the counter -->
  <g id="ic-penguin" class="tap eater" data-eater="penguin" transform="translate(610,568)"><g class="anim">
    <g class="flipL"><ellipse cx="-94" cy="-120" rx="26" ry="62" fill="#2b3a55" transform="rotate(18 -94 -120)"/></g>
    <g class="flipR"><ellipse cx="94" cy="-120" rx="26" ry="62" fill="#2b3a55" transform="rotate(-18 94 -120)"/></g>
    <ellipse cy="-110" rx="100" ry="130" fill="#2b3a55"/>
    <ellipse cy="-70" rx="72" ry="96" fill="#fff"/>
    <ellipse cy="-162" rx="64" ry="46" fill="#fff"/>
    <circle cx="-26" cy="-174" r="11" fill="#1b1b1b"/><circle cx="26" cy="-174" r="11" fill="#1b1b1b"/>
    <circle cx="-22" cy="-178" r="4" fill="#fff"/><circle cx="30" cy="-178" r="4" fill="#fff"/>
    <circle cx="-50" cy="-148" r="11" fill="#ff8fa8" opacity=".6"/><circle cx="50" cy="-148" r="11" fill="#ff8fa8" opacity=".6"/>
    <path class="mouth-closed" d="M-22 -158 L22 -158 L0 -134Z" fill="#ff9f1c" stroke="#e07a00" stroke-width="4" stroke-linejoin="round"/>
    <g class="mouth-open"><path d="M-24 -164 L24 -164 L0 -150Z M-20 -144 L20 -144 L0 -126Z" fill="#ff9f1c" stroke="#e07a00" stroke-width="4" stroke-linejoin="round"/><ellipse cy="-147" rx="14" ry="5" fill="#7a1d33"/></g>
    <path d="M-30 -74 L0 -60 L-30 -46Z M30 -74 L0 -60 L30 -46Z" fill="#e3263b" stroke="#a8182a" stroke-width="3" stroke-linejoin="round"/><circle cy="-60" r="7" fill="#a8182a"/>
    <g transform="translate(0,-236)">
      <rect x="-56" y="-10" width="112" height="32" rx="10" fill="#fff" stroke="#d8d8e6" stroke-width="4"/>
      <circle cx="-36" cy="-34" r="32" fill="#fff"/><circle cx="0" cy="-52" r="38" fill="#fff"/><circle cx="36" cy="-34" r="32" fill="#fff"/>
    </g>
  </g></g>

  <!-- counter -->
  <rect y="560" width="1600" height="340" fill="url(#ic-check)"/>
  <rect y="548" width="1600" height="24" rx="8" fill="#fff" stroke="#f0b3c8" stroke-width="5"/>
  <ellipse cx="800" cy="562" rx="86" ry="14" fill="#f5c6d8" stroke="#e79ab8" stroke-width="4"/>

  <!-- cones and cup to pick from -->
  <g class="tap" data-act="base" data-base="cone" transform="translate(240,462) scale(.74)"><g class="anim base-art" data-art="cone"></g></g>
  <g class="tap" data-act="base" data-base="choco" transform="translate(335,462) scale(.74)"><g class="anim base-art" data-art="choco"></g></g>
  <rect x="190" y="500" width="196" height="60" rx="12" fill="#c98a5a" stroke="#8e5a35" stroke-width="5" pointer-events="none"/>
  <path d="M206 520 h164" stroke="#b07648" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
  <g class="tap" data-act="base" data-base="cup" transform="translate(452,486) scale(.7)"><g class="anim base-art" data-art="cup"></g></g>

  <!-- customers: puffin on the counter, a polar bear cub and a walrus out front -->
  <g id="ic-puffin" class="tap eater" data-eater="puffin" transform="translate(1100,560)"><g class="anim">
    <ellipse cx="-14" cy="-4" rx="15" ry="7" fill="#ff7a2e"/><ellipse cx="14" cy="-4" rx="15" ry="7" fill="#ff7a2e"/>
    <ellipse cy="-58" rx="42" ry="56" fill="#222b3a"/>
    <ellipse cy="-42" rx="28" ry="38" fill="#fff"/>
    <ellipse cy="-96" rx="32" ry="24" fill="#fff"/>
    <circle cx="-12" cy="-100" r="5" fill="#111"/><circle cx="12" cy="-100" r="5" fill="#111"/>
