<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mythica Farmer · Green Bear Arcade</title>
  <!-- Claude Farmer is now Mythica Farmer; this keeps old links and home-screen icons working. -->
  <link rel="canonical" href="../mythica-farmer/">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
    a { color: #f5b942; }
    p { padding: 24px; margin: 0; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <p id="moved">Claude Farmer is now <a href="../mythica-farmer/index.html">Mythica Farmer</a>.</p>
  <script>
    (function () {
      // A home-screen icon saved from this old address can only stay full screen on this page:
      // going to the new address would leave the app's address and bring up the browser's banner.
      // So an icon launch plays the game right here, framed; everywhere else simply moves on.
      const app = ["fullscreen", "standalone"].some((m) => matchMedia("(display-mode: " + m + ")").matches) || navigator.standalone === true;
      if (!app) { location.replace("../mythica-farmer/index.html" + location.search); return; }
      document.getElementById("moved").remove();
      const frame = document.createElement("iframe");
      frame.src = "../mythica-farmer/index.html?app=1";
      frame.title = "Mythica Farmer";
      frame.allow = "fullscreen; autoplay";
      document.body.append(frame);
      frame.addEventListener("load", () => frame.focus());
    })();
  </script>
</body>
</html>
