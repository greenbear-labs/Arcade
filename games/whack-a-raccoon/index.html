<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whack-a-Raccoon · Green Bear Arcade</title>
  <meta name="description" content="Trash bandits incoming. Punch the raccoons, spare the cubs. From Green Bear Arcade.">
  <meta name="theme-color" content="#0b0d0a">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="../../shared/game.css">
</head>
<body class="game">
  <header class="game-bar">
    <a class="back" href="../../index.html"><img src="../../assets/favicon.png" alt="">← The Den</a>
    <h1>Whack-a-Raccoon</h1>
    <div class="stats">
      <span>SCORE <b id="score">0</b></span>
      <span>BEST <b id="best">0</b></span>
      <button class="icon-btn" id="mute" type="button"></button>
    </div>
  </header>

  <main class="stage" style="--screen-max: 620px">
    <div class="screen">
      <canvas id="game" aria-label="Whack-a-Raccoon game screen"></canvas>
      <div class="overlay" id="overlay" role="status" aria-live="polite"></div>
    </div>
    <p class="howto">
      <span class="touch-only">Tap a raccoon to punch it.</span>
      <span class="keys-only">Click a raccoon, or use <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> (or the number pad) to punch each can.</span>
      Chain hits for a combo, go for the gold raccoon, and never punch a bear cub.
    </p>
  </main>

  <script src="../../shared/arcade.js"></script>
  <script src="game.js"></script>
</body>
</html>
