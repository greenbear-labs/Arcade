<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <title>Deck Match</title>
  <link rel="stylesheet" href="lab.css?v=1">
  <style>
    .app { display: flex; flex-direction: column; }
    .topbar { position: relative; flex: none; }
    .foes { position: relative; flex: 1 1 auto; min-height: 180px; display: flex; align-items: flex-end; justify-content: center; gap: 3%; padding: 26px 6% 4px; z-index: 5; }
    .foes .enemy { position: relative; height: 100%; flex: 0 1 30%; justify-content: flex-end; cursor: pointer; }
    .foes .enemy img { width: auto; max-width: 100%; max-height: calc(100% - 30px); object-fit: contain; }
    .foes .enemy.boss { flex-basis: 60%; }
    .cd { position: absolute; top: 0; right: 4%; min-width: 30px; height: 30px; border-radius: 15px; background: rgba(10,10,25,.85); border: 2px solid var(--line); font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
    .cd.warn { border-color: var(--red); color: var(--red); animation: pulse .5s infinite alternate; }
    .cd.stun { border-color: var(--blue); color: var(--blue); }
    .cards { position: relative; flex: none; background: none; padding: 4px 8px; }
    .card { aspect-ratio: 5 / 3; }
    .card img.face { object-position: 50% 20%; }
    .card.shielded { outline: 2px solid var(--blue); outline-offset: -4px; }
    .boardwrap { position: relative; flex: none; display: flex; justify-content: center; padding: 4px 0 calc(env(safe-area-inset-bottom) + 8px); z-index: 10; }
    .board { position: relative; background: rgba(8,8,20,.78); border: 1px solid var(--line); border-radius: 14px; touch-action: none; }
    .tile { position: absolute; left: 0; top: 0; border-radius: 22%; display: flex; align-items: center; justify-content: center; transition: transform .18s ease-in, opacity .2s; will-change: transform; }
    .tile .gem { width: 86%; height: 86%; border-radius: 50%; overflow: hidden; border: 3px solid; box-shadow: inset 0 -4px 8px rgba(0,0,0,.45), 0 2px 4px rgba(0,0,0,.5); background: #222; position: relative; }
    .tile .gem img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .tile.heart .gem { background: radial-gradient(circle at 40% 35%, #ff9fc2, #d92a6a); border-color: #ffd0e2; display: flex; align-items: center; justify-content: center; font-size: 150%; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.4); }
    .tile.star .gem::after { content: "★"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff6d0; font-size: 170%; text-shadow: 0 0 6px #000, 0 0 12px var(--gold); background: rgba(238,199,107,.25); }
    .tile.sel .gem { outline: 3px solid #fff; outline-offset: 1px; }
    .tile.pop { opacity: 0; transition: transform .2s, opacity .2s; }
    .tile.dim .gem { filter: grayscale(1) brightness(.5); }
    .tile.hint .gem { animation: wiggle .5s infinite alternate; }
    @keyframes wiggle { from { transform: scale(.9) rotate(-8deg); } to { transform: scale(1.08) rotate(8deg); } }
    .combo { position: absolute; z-index: 45; left: 50%; top: 40%; transform: translateX(-50%); font-weight: 900; font-size: 26px; color: var(--gold); font-style: italic; text-shadow: 0 2px 0 #000; pointer-events: none; animation: float .9s ease-out forwards; }
    .tip { position: absolute; left: 0; right: 0; top: 50px; text-align: center; font-size: 12px; color: var(--text); text-shadow: 0 1px 3px #000; z-index: 25; pointer-events: none; transition: opacity .6s; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="bg" id="bg"></div>
    <div class="topbar">
      <a class="pill btn" href="index.html" aria-label="Back to Battle Lab">✕</a>
      <span class="pill" id="wave">W1/3</span>
      <span class="pill" id="moves">MOVES 0</span>
      <span class="grow"></span>
      <button class="pill btn" id="hintb">HINT</button>
      <button class="pill btn" id="mute">♪</button>
    </div>
    <div class="tip" id="tip">Swipe a tile to swap it. Match 3+ to attack. The number on each enemy is turns until it strikes.</div>
    <div class="foes" id="foes"></div>
    <div id="cardslot"></div>
    <div class="boardwrap"><div class="board" id="board"></div></div>
  </div>
  <script src="shared.js?v=1"></script>
  <script src="match.js?v=1"></script>
</body>
</html>
