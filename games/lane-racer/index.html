<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lane Racer</title>
  <meta name="description" content="A cheerful lane racing game for little drivers.">
  <meta name="theme-color" content="#4cc3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lane Racer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Title (a demo race plays behind it) -->
  <div id="title" class="title-screen">
    <div class="title big">
      <span class="t1">LANE</span><span class="t2">RACER</span>
    </div>
    <button id="play" class="play-btn" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>
  </div>

  <!-- Car select -->
  <div id="select" class="screen hidden">
    <button id="back-cars" class="round-btn back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="title">
      <span class="t1">LANE</span><span class="t2">RACER</span>
    </div>
    <div id="cars" class="cars"></div>
    <button id="sound-sel" class="round-btn sound-btn" aria-label="Sound on or off"></button>
  </div>

  <!-- Track select -->
  <div id="tracks" class="screen hidden">
    <button id="back-tracks" class="round-btn back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="pick-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 2v20h2v-7h5l1 2h7V5h-6l-1-2H7V2z"/></svg>
    </div>
    <div id="tracks-grid" class="cars tracks"></div>
  </div>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <button id="home" class="round-btn" aria-label="Pick a new car">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
    </button>
    <div class="meter" aria-hidden="true">
      <div class="coin-icon"></div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="trophies" class="trophies"></div>
    </div>
    <button id="sound" class="round-btn sound-btn" aria-label="Sound on or off"></button>
    <div class="arrow left" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></div>
    <div class="arrow right" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
